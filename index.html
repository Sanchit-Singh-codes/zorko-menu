    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {

      background: var(--z-black);
      color: var(--z-text);
      overflow-x: hidden;
      line-height: 1.5;
    }

    .hero {

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 60px 20px;
      position: relative;
      background: radial-gradient(ellipse 60% 40% at 50% 60%, rgba(255,107,0,0.06) 0%, transparent 70%);
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 18px;
      border: 1px solid rgba(255,107,0,0.3);
      border-radius: 100px;
      font-size: 12px;
      font-weight: 500;
      color: var(--z-orange-light);
      margin-bottom: 20px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .hero-badge .dot {
      width: 6px; height: 6px;
      background: var(--z-orange);
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .hero h1 {
      font-size: clamp(56px, 12vw, 120px);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -3px;
      background: linear-gradient(135deg, var(--z-orange) 0%, var(--z-orange-light) 50%, #FFB347 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 12px;
    }

    .hero p {
      font-size: 16px;
      color: var(--z-muted);
      font-weight: 300;
      max-width: 400px;
    }

    .offer-bar {
      background: linear-gradient(90deg, var(--z-orange), var(--z-orange-dark));
      padding: 10px;
      text-align: center;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.5px;
    }

    .menu-nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(10,10,10,0.95);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--z-border);
      padding: 12px 20px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }

    .menu-nav::-webkit-scrollbar { display: none; }

    .nav-inner {
      display: flex;
      gap: 8px;
      justify-content: center;
      min-width: max-content;
    }

    .nav-btn {
      padding: 8px 18px;
      background: transparent;
      border: 1px solid var(--z-border);
      border-radius: 100px;
      color: var(--z-muted);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.25s ease;
      font-family: inherit;
      white-space: nowrap;
    }

    .nav-btn:hover {
      border-color: var(--z-orange);
      color: var(--z-orange-light);
    }

    .nav-btn.active {
      background: var(--z-orange);
      border-color: var(--z-orange);
      color: white;
    }

    .menu-wrap {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 20px 80px;
    }

    .cat-section {
      margin-bottom: 48px;
      opacity: 0;
      transform: translateY(30px);
      transition: all 0.6s ease;
    }

    .cat-section.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .cat-header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
      padding-bottom: 12px;
      border-bottom: 2px solid var(--z-orange);
    }

    .cat-header h2 {
      font-size: 24px;
      font-weight: 700;
      color: var(--z-orange);
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .cat-header .line {
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, var(--z-orange), transparent);
    }

    .cat-header .icon {
      font-size: 24px;
    }

    .item-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 14px 0;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      transition: all 0.3s ease;
      position: relative;
    }

    .item-row:hover {
      background: rgba(255,107,0,0.03);
      padding-left: 12px;
      padding-right: 12px;
      margin: 0 -12px;
      border-radius: 8px;
    }

    .item-row:hover::before {
      content: '';
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 3px;
      height: 60%;
      background: var(--z-orange);
      border-radius: 0 3px 3px 0;
    }

    .item-info { flex: 1; min-width: 0; }

    .item-name {
      font-size: 16px;
      font-weight: 600;
      color: var(--z-text);
      margin-bottom: 3px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .item-desc {
      font-size: 12px;
      color: var(--z-dim);
      line-height: 1.4;
      max-width: 500px;
    }

    .item-price {
      font-size: 18px;
      font-weight: 700;
      color: var(--z-orange);
      white-space: nowrap;
      text-align: right;
      margin-left: 16px;
    }

    .item-price .extra {
      display: block;
      font-size: 11px;
      color: var(--z-dim);
      font-weight: 400;
      margin-top: 2px;
    }

    .tag-inline {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 100px;
      font-size: 9px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      vertical-align: middle;
    }

    .tag-b { background: rgba(255,107,0,0.15); color: var(--z-orange-light); border: 1px solid rgba(255,107,0,0.2); }
    .tag-n { background: rgba(0,200,83,0.12); color: var(--z-green); border: 1px solid rgba(0,200,83,0.2); }
    .tag-m { background: rgba(255,23,68,0.12); color: var(--z-red); border: 1px solid rgba(255,23,68,0.2); }
    .tag-v { background: rgba(0,200,83,0.08); color: #4CAF50; border: 1px solid rgba(76,175,80,0.15); }

    .two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
    }

    @media (max-width: 900px) {
      .two-col { grid-template-columns: 1fr; gap: 0; }
    }

    .combo-section { margin-top: 60px; padding-top: 40px; border-top: 2px solid var(--z-border); }

    .combo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
      margin-top: 24px;
    }

    .combo-item {
      background: var(--z-card);
      border: 1px solid var(--z-border);
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      transition: all 0.3s ease;

      transform: translateY(-3px);

function tagHtml(t) {
  const cls = t === 'best' ? 'tag-b' : t === 'new' ? 'tag-n' : t === 'must' ? 'tag-m' : 'tag-v';
  const label = t === 'best' ? 'Best Seller' : t === 'new' ? 'New Launch' : t === 'must' ? 'Must Try' : 'Veg';
  return `<span class="tag-inline ${cls}">${label}</span>`;
}

function renderCategory(key, cat) {
  const itemsHtml = cat.items.map(item => {
    const tags = item.t.map(tagHtml).join('');
    const extra = item.e ? `<span class="extra">/ &#8377;${item.e}</span>` : '';
    const desc = item.d ? `<div class="item-desc">${item.d}</div>` : '';
    return `
      <div class="item-row">
        <div class="item-info">
          <div class="item-name">${item.n} ${tags}</div>
          ${desc}
        </div>
        <div class="item-price">&#8377;${item.p}${extra}</div>
      </div>
    `;
  }).join('');

  return `
    <div class="cat-section" data-cat="${key}">
      <div class="cat-header">
        <span class="icon">${cat.icon}</span>
        <h2>${cat.name}</h2>
        <div class="line"></div>
      </div>
      ${itemsHtml}
    </div>
  `;
}

function renderCombos() {
  const comboHtml = combos.map(c => `
    <div class="combo-item">
      <div class="emoji">${c.icon}</div>
      <div class="title">${c.title}</div>
      <div class="sub">${c.items}</div>
      <div class="price"><span>&#8377;</span>${c.price}</div>
    </div>
  `).join('');

  const mealHtml = meals.map(m => `
    <div class="meal-item">
      <div class="emoji">${m.icon}</div>
      <div class="title">${m.title}</div>
      <div class="sub">${m.items}</div>
      <div class="price">&#8377;${m.price}</div>
    </div>
  `).join('');

  return `
    <div class="cat-section" data-cat="combo">
      <div class="cat-header">
        <span class="icon">&#127881;</span>
        <h2>Try Our Combos</h2>
        <div class="line"></div>
      </div>
      <div class="combo-grid">${comboHtml}</div>

      <div style="margin-top:40px;">
        <div class="cat-header">
          <span class="icon">&#127869;</span>
          <h2>Make A Meal</h2>
          <div class="line"></div>
        </div>
        <div class="meal-grid">${mealHtml}</div>
      </div>

      <p style="text-align:center; color: var(--z-muted); font-size: 13px; margin-top: 20px;">Add Rs 10/- And Get Cold Coffee Instead Of Mojito</p>
    </div>
  `;
}

function renderAll() {
  const container = document.getElementById('menuContent');
  let html = '<div class="two-col">';

  const keys = Object.keys(categories);
  const mid = Math.ceil(keys.length / 2);

  html += '<div>';
  keys.slice(0, mid).forEach(k => {
    html += renderCategory(k, categories[k]);
  });
  html += '</div><div>';
  keys.slice(mid).forEach(k => {
    html += renderCategory(k, categories[k]);
  });
  html += '</div></div>';

  html += renderCombos();
  container.innerHTML = html;

  requestAnimationFrame(() => {
    document.querySelectorAll('.cat-section').forEach((el, i) => {
      setTimeout(() => el.classList.add('visible'), i * 80);
    });
  });
}

function renderFilter(cat) {
  const container = document.getElementById('menuContent');
  if (cat === 'all') { renderAll(); return; }
  if (cat === 'combo') {
    container.innerHTML = renderCombos();
    requestAnimationFrame(() => {
      document.querySelectorAll('.cat-section').forEach(el => el.classList.add('visible'));
    });
    return;
  }
  if (categories[cat]) {
    container.innerHTML = renderCategory(cat, categories[cat]);
    requestAnimationFrame(() => {
      document.querySelector('.cat-section').classList.add('visible');
    });
  }
}

document.querySelector('.menu-nav').addEventListener('click', (e) => {
  if (e.target.classList.contains('nav-btn')) {
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    e.target.classList.add('active');
    renderFilter(e.target.dataset.cat);
  }
});

renderAll();
